# CI + optional deploy for the hoodie store.
#
# The CI job always runs: typecheck + production build, so a broken commit never
# reaches main unnoticed. The deploy job stays DORMANT until you add the
# repository variable VERCEL_DEPLOY_ENABLED=true plus the three Vercel secrets —
# until then it skips silently instead of failing on every push.
#
# Most people do not need the deploy job at all: Vercel/Netlify/Render build
# straight from the GitHub repo when you connect it (see hoodie-store/DEPLOYMENT.md).

name: hoodie-store

on:
  push:
    branches: [main]
    paths: ["hoodie-store/**", ".github/workflows/hoodie-store.yml"]
  pull_request:
    paths: ["hoodie-store/**", ".github/workflows/hoodie-store.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: hoodie-store

jobs:
  ci:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hoodie-store/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
